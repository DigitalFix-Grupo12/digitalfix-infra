# DigitalFix - configuracion comun de los 2 nodos RabbitMQ (montada read-only).
# Formacion del cluster: descubrimiento "classic_config" con la lista fija de nodos.
# Al arrancar, cada nodo contacta a los demas de la lista y se une al primero
# disponible (el cookie de Erlang debe ser identico en ambos).
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbit1
cluster_formation.classic_config.nodes.2 = rabbit@rabbit2
cluster_formation.discovery_retry_limit = 30
cluster_formation.discovery_retry_interval = 2000

# RabbitMQ 4.2 guarda los metadatos (colas, exchanges, bindings, usuarios) en
# Khepri, replicado con Raft entre los nodos del cluster. cluster_partition_handling
# ya no aplica con Khepri: la consistencia la da el consenso Raft.


# Limites conservadores para correr 2 nodos en una t3.small (2 GB)
vm_memory_high_watermark.relative = 0.35
disk_free_limit.absolute = 512MB

management.tcp.port = 15672
